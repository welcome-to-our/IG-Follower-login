<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG-Followers — Demo Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-card" aria-labelledby="brand">
    <h1 id="brand">IG-Followers</h1>

    <form id="loginForm" novalidate>
      <label class="sr-only" for="username">Username</label>
      <input id="username" name="username" type="text"
             placeholder="Username" autocomplete="off" required>

      <label class="sr-only" for="password">Password</label>
      <input id="password" name="password" type="password"
             placeholder="Password" autocomplete="off" required>

      <button type="submit">Login</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <p class="forgot">Forgot your login details?
      <a href="#" id="helpLink">Get help signing in.</a>
    </p>

    <div class="divider"><span>OR</span></div>

    <button class="facebook" type="button" id="facebookButton">
      <span class="facebook-icon">f</span>
      Log In With Facebook
    </button>

    <footer>Don't have an account? <a href="#" id="signupLink">Sign Up.</a></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
